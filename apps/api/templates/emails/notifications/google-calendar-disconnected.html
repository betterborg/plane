<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 32px; background: #f6f6f6; color: #171717; font-family: Arial, sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 560px; background: #ffffff; border-radius: 8px"
          >
            <tr>
              <td style="padding: 32px">
                <h1 style="margin: 0 0 16px; font-size: 24px">Reconnect Google Calendar</h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 24px">
                  Plane can no longer access your Google Calendar for {{ workspace_name }}. Reconnect it to resume
                  syncing.
                </p>
                <a
                  href="{{ settings_url }}"
                  style="display: inline-block; padding: 12px 18px; border-radius: 6px; background: #3f76ff; color: #ffffff; text-decoration: none"
                  >Reconnect Google Calendar</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
